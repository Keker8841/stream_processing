[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vq-generator"
version = "0.1.0"
description = "Seeded mining-site telemetry generator for the virtual-queue stream-processing task"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vq-generator = "generator.cli:main"

[tool.setuptools]
packages = ["generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "kafka: needs a running Kafka broker",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vq-service"
version = "0.1.0"
description = "Virtual-queue stream processor: telemetry.v1 -> queue.v1 / decision.v1 (Kafka, exactly-once)"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vq-service = "vqservice.cli:main"

[tool.setuptools]
packages = ["vqservice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "kafka: needs a running Kafka broker",
]
